<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Loop Workspace to Markdown</title>
  <style>
    :root { --bg: #fff; --text: #1f2328; --muted: #656d76; --accent: #2563eb; --accent-hover: #1d4ed8; --border: #d0d7de;
            --info-bg: #ddf4ff; --ok-bg: #dafbe1; --ok: #1a7f37; --err-bg: #ffebe9; --err: #cf222e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161b22; --text: #e6edf3; --muted: #8d96a0; --accent: #4493f8; --accent-hover: #2f81f7; --border: #30363d;
              --info-bg: #0c2d6b; --ok-bg: #0f2e1a; --ok: #3fb950; --err-bg: #3a1214; --err: #f85149; }
    }
    body { width: 300px; margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, 'Segoe UI', sans-serif; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    h2 { font-size: 13px; margin: 0 0 6px; }
    button { display: block; width: 100%; margin: 6px 0; padding: 9px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button[hidden], [hidden] { display: none; }
    #lastRun { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); overflow-wrap: anywhere; } /* long titles must wrap */
    #lastRun p { margin: 4px 0; }
    #failedList { margin: 4px 0 8px; padding-left: 18px; }
    .note, #progress { color: var(--muted); font-size: 12px; }
    #status:empty { display: none; }
    #status { margin-top: 12px; padding: 8px 10px; border-radius: 6px; overflow-wrap: anywhere; }
    #status.info { background: var(--info-bg); }
    #status.success { background: var(--ok-bg); color: var(--ok); }
    #status.error { background: var(--err-bg); color: var(--err); }
    #progress { margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Loop Workspace to Markdown</h1>
  <button id="exportBtn">Export Workspace</button>
  <button id="exportPageBtn">Export Page</button>
  <div id="lastRun" hidden>
    <h2>Last workspace export</h2>
    <p id="lastRunSummary"></p>
    <ul id="failedList"></ul>
    <button id="resumeBtn" hidden>Continue export</button>
    <button id="retryBtn" hidden>Try failed pages again</button>
    <p id="retryNote" class="note" hidden>Only these pages are copied again. The export is then rebuilt and saved to your Downloads folder.</p>
    <button id="redownloadBtn" hidden>Download last export again</button>
  </div>
  <div id="status" role="status"></div>
  <div id="progress"></div>
  <script src="export-core.js"></script>
  <script src="popup-simple.js"></script>
</body>
</html>
