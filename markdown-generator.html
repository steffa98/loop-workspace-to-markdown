<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Loop export</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #656d76; --accent: #2563eb; --ok: #1a7f37; --err: #cf222e; --border: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8d96a0; --accent: #4493f8; --ok: #3fb950; --err: #f85149; --border: #30363d; }
    }
    body { margin: 0; padding: 24px; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, 'Segoe UI', sans-serif; }
    main { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 16px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
    button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
    button.secondary { background: transparent; color: var(--accent); }
    #status.success { color: var(--ok); }
    #status.error { color: var(--err); }
    pre, textarea { box-sizing: border-box; width: 100%; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 12px; font: 13px/1.5 ui-monospace, Consolas, monospace; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; } /* long links must wrap */
    pre:empty { display: none; }
    textarea { min-height: 50vh; resize: vertical; }
    .coffee { color: var(--muted); font-size: 12px; text-align: right; margin: 8px 0 0; }
    .coffee a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Loop export</h1>
    <p class="sub">Markdown export. The file is saved to your Downloads folder automatically.</p>
    <div class="bar">
      <button id="download">Download again</button>
      <button id="copy" class="secondary" hidden>Copy to clipboard</button>
      <span id="status" role="status">Building the Markdown…</span>
    </div>
    <pre id="report"></pre>
    <textarea id="editor" readonly aria-label="Markdown"></textarea>
    <p class="coffee">Saved you time? <a href="https://revolut.me/andreao2ej" target="_blank" rel="noopener">Buy me a coffee ☕</a></p>
  </main>
  <script src="jszip.min.js"></script>
  <script src="export-core.js"></script>
  <script src="loop-markdown.js"></script>
  <script src="markdown-generator.js"></script>
</body>
</html>
